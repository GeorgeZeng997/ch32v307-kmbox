name: Build CH32V307 KMBox Net Firmware

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install xPack RISC-V Embedded GCC
        run: |
          TOOLCHAIN_VER="13.2.0-2"
          ARCHIVE="xpack-riscv-none-elf-gcc-${TOOLCHAIN_VER}-linux-x64.tar.gz"
          curl -fL "https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v${TOOLCHAIN_VER}/${ARCHIVE}" -o "/tmp/${ARCHIVE}"
          mkdir -p "$HOME/opt/riscv-gcc"
          tar -xzf "/tmp/${ARCHIVE}" -C "$HOME/opt/riscv-gcc" --strip-components=1
          echo "$HOME/opt/riscv-gcc/bin" >> $GITHUB_PATH

      - name: Configure and Build Firmware
        run: |
          set +e
          riscv-none-elf-objcopy --remove-section=.riscv.attributes SDK/NetLib/libwchnet.a > build.log 2>&1
          cmake -B build >> build.log 2>&1
          rc=$?
          if [ $rc -eq 0 ]; then
            cmake --build build --parallel >> build.log 2>&1
            rc=$?
          fi
          cat build.log
          if [ $rc -ne 0 ]; then
            tail -n 20 build.log | while IFS= read -r line; do echo "::error::$line"; done
            exit $rc
          fi

      - name: Upload Firmware Artifacts (.hex / .bin / .elf)
        uses: actions/upload-artifact@v4
        with:
          name: ch32v307-kmbox-firmware
          path: |
            build/ch32v307_kmbox.hex
            build/ch32v307_kmbox.bin
            build/ch32v307_kmbox.elf
            build/ch32v307_kmbox.map
